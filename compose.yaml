name: ifood-orders

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: ifood-orders-php
  volumes:
    - .:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "${APP_PORT:-8000}:8000"

  horizon:
    <<: *php
    command: php artisan horizon
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  vite:
    image: node:24-trixie-slim
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "${VITE_PORT:-5173}:5173"
    profiles: [dev]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ifood_orders
      POSTGRES_USER: ifood
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifood -d ifood_orders"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
